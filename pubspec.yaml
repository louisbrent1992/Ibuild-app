name: ibuild
description: A phone-first control plane for iOS and Flutter builds that run on remote Mac infrastructure.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  dart_jsonwebtoken: ^2.14.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
